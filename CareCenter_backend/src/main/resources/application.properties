#Tomact port
server.port=9090
#mysql
spring.datasource.url=jdbc:mysql://localhost:3306/carecentermanagement?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#encoding
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.tomcat.uri-encoding=UTF-8
#file upload size limit (20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# Logging configuration
logging.level.root=WARN
logging.level.com.example.springboot=ERROR
logging.level.com.example.springboot.mapper=ERROR
logging.level.com.example.springboot.controller=ERROR
logging.level.com.example.springboot.service=ERROR
logging.level.org.springframework.web=WARN
logging.level.org.mybatis=WARN
logging.level.org.apache.ibatis=WARN
logging.level.java.sql=WARN
logging.level.com.baomidou.mybatisplus=WARN
# Console output pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n